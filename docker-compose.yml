# docker-compose.yml
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sonara-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"